<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>📚 My Library</h1>

  <!-- Button to show new book form -->
  <button id="newBookBtn">+ Add New Book</button>

  <!-- New book form -->
  <form id="bookForm" class="hidden">
    <input type="text" id="title" placeholder="Book Title" required>
    <input type="text" id="author" placeholder="Author" required>
    <input type="number" id="pages" placeholder="Pages" required>
    <label>
      <input type="checkbox" id="read"> Read
    </label>
    <button type="submit">Add Book</button>
  </form>

  <!-- Container to show books -->
  <div id="library"></div>

  <script src="script.js"></script>
</body>
</html>
